name: Run Sensei Agent

on:
  issues:
    types: [labeled]

jobs:
  implement:
    # Only run when 'agent-ready' label is added
    if: github.event.label.name == 'agent-ready'
    runs-on: ubuntu-latest

    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Git
        run: |
          git config --global user.name "Pattern Suggestion Bot"
          git config --global user.email "noreply@anthropic.com"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install anthropic

      - name: Extract skill name and create branch
        id: setup
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Get issue body
          issue_body=$(gh issue view ${{ github.event.issue.number }} --json body -q '.body')

          # Extract skill name from issue body (format: **Skill**: `skill-name`)
          skill_name=$(echo "$issue_body" | grep -oE '\*\*Skill\*\*: `[^`]+`' | sed 's/\*\*Skill\*\*: `\([^`]*\)`/\1/')

          if [ -z "$skill_name" ]; then
            echo "::error::Could not extract skill name from issue body"
            exit 1
          fi

          echo "skill_name=$skill_name" >> $GITHUB_OUTPUT

          # Create branch
          branch_name="fix/${skill_name}/${{ github.event.issue.number }}"
          git checkout -b "$branch_name"
          echo "branch_name=$branch_name" >> $GITHUB_OUTPUT

      - name: Run Sensei Agent
        id: agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/automation/sensei_agent.py \
            --issue ${{ github.event.issue.number }} \
            --repo ${{ github.repository }} \
            --skill "${{ steps.setup.outputs.skill_name }}"

      - name: Push branch and create PR
        id: pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          branch_name="${{ steps.setup.outputs.branch_name }}"
          skill_name="${{ steps.setup.outputs.skill_name }}"
          issue_number="${{ github.event.issue.number }}"

          # Push branch
          git push -u origin "$branch_name"

          # Create PR
          pr_url=$(gh pr create \
            --title "fix($skill_name): Improve skill based on eval feedback #${issue_number}" \
            --body "$(cat <<'EOF'
          ## Summary

          Automated skill improvement based on evaluation feedback from issue #${{ github.event.issue.number }}.

          **Skill**: \`${{ steps.setup.outputs.skill_name }}\`

          ## Changes Made

          See commit messages for details of changes made by the Sensei agent.

          ## Test Plan

          - [ ] Verify skill validation passes: \`python3 scripts/validate-skills.py skills/${{ steps.setup.outputs.skill_name }}\`
          - [ ] Review changes align with evaluation feedback
          - [ ] Test skill invocation with sample prompts

          ---

          Closes #${{ github.event.issue.number }}

          Generated by Sensei Agent
          EOF
          )")

          echo "pr_url=$pr_url" >> $GITHUB_OUTPUT

      - name: Update issue labels
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue edit ${{ github.event.issue.number }} \
            --remove-label "agent-ready" \
            --add-label "agent-completed"

      - name: Comment on issue with PR link
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const issue_number = context.issue.number;
            const pr_url = '${{ steps.pr.outputs.pr_url }}';
            const skill_name = '${{ steps.setup.outputs.skill_name }}';

            let body = '## Sensei Agent Completed\n\n';
            body += `**Skill improved:** \`${skill_name}\`\n\n`;

            if (pr_url) {
              body += `**Pull Request:** ${pr_url}\n\n`;
            }

            body += `### Next Steps\n`;
            body += `1. Review the generated PR\n`;
            body += `2. Verify the changes address the evaluation feedback\n`;
            body += `3. Run skill validation\n`;
            body += `4. Merge if changes are satisfactory\n\n`;
            body += `Generated by Sensei Agent`;

            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue_number,
              body: body
            });

      - name: Handle failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const issue_number = context.issue.number;

            let body = '## Sensei Agent Failed\n\n';
            body += 'The agent encountered an error while processing this issue.\n\n';
            body += '### Troubleshooting\n';
            body += '- Check that `ANTHROPIC_API_KEY` secret is configured\n';
            body += '- Verify the issue body contains `**Skill**: \\`skill-name\\``\n';
            body += '- Check the [workflow logs](' + context.payload.repository.html_url + '/actions) for details\n\n';
            body += 'You can retry by removing and re-adding the `agent-ready` label.\n\n';
            body += 'Generated by Sensei Agent';

            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue_number,
              body: body
            });
