name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - "skills/**"
      - ".claude-plugin/**"
      - "hooks/**"

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            This is the claudex skills marketplace. Please review this pull request focusing on:

            **For skill changes (skills/**):**
            - SKILL.md has valid frontmatter (name, description)
            - Name matches directory name (Anthropic spec requirement)
            - Description is clear with trigger phrases and boundaries
            - Progressive disclosure pattern (lean SKILL.md, details in subdirs)
            - CHANGELOG.md is updated with version bump

            **For marketplace changes (.claude-plugin/**):**
            - Valid JSON schema
            - Skill paths exist
            - Version bump follows semver

            **General:**
            - Conventional commit messages
            - No plugin.json files in skill directories
            - Security (no secrets, safe patterns)

            Use the repository's CLAUDE.md for detailed conventions. Be constructive and specific.

            Use `gh pr comment` with your Bash tool to leave your review as a comment on the PR.

          claude_args: '--allowed-tools "Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*)"'
